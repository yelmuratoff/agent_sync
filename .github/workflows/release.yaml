name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          file_version=$(cat VERSION)
          if [[ "$file_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::VERSION file ($file_version) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          changelog_body=$(awk -v ver="## ${version}" \
            '$0 == ver {found=1; next} found && /^## /{exit} found' CHANGELOG.md)

          {
            if [[ -n "$changelog_body" ]]; then
              echo "$changelog_body"
              echo ""
            fi
            echo "## Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/yelmuratoff/agent/main/install.sh | bash"
            echo '```'
            echo ""
            echo "## Update"
            echo ""
            echo '```bash'
            echo "agentsync update"
            echo '```'
          } > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
