name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -S warning -e SC1091 bin/agentsync.sh
          shellcheck -x -S warning -e SC1091 lib/sync.sh
          shellcheck -x -S warning -e SC1091 lib/check.sh
          shellcheck -x -S warning -e SC1091 lib/setup_hooks.sh
          shellcheck -x -S warning -e SC1091 lib/helpers/*.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core
          else
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Run unit tests
        shell: bash
        run: bats tests/cli.bats tests/files.bats tests/gitignore.bats tests/list.bats tests/generate.bats tests/init.bats tests/hooks.bats tests/release.bats --tap
        env:
          TERM: xterm

      - name: Run integration tests
        shell: bash
        run: bats tests/sync.bats tests/sync_options.bats tests/check.bats --tap
        env:
          TERM: xterm
