name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -S warning -e SC1091 bin/agentsync.sh
          shellcheck -x -S warning -e SC1091 lib/sync.sh
          shellcheck -x -S warning -e SC1091 lib/check.sh
          shellcheck -x -S warning -e SC1091 lib/setup_hooks.sh
          shellcheck -x -S warning -e SC1091 lib/helpers/*.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Serial Windows is slow (process spawning); allow it to finish while still
    # bounding a true hang far below the 6h default. Tighten once the real
    # green-run wall-time is known.
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and GNU parallel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats parallel
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core parallel
          else
            # Windows runs bats serially (see Run tests), so it needs no GNU
            # parallel: git-bash spawns processes slowly enough that parallel's
            # own overhead made the suite hang for hours, far worse than serial.
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Exclude work dirs from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          # Defender real-time scanning of every spawned process dominates the
          # process-heavy bats run on Windows. Excluding the build/temp trees is
          # the largest cheap win; it never affects test correctness.
          Add-MpPreference -ExclusionPath "${env:GITHUB_WORKSPACE}"
          Add-MpPreference -ExclusionPath "${env:RUNNER_TEMP}"
          Add-MpPreference -ExclusionPath "${env:TEMP}"

      - name: Run tests
        shell: bash
        run: |
          # Linux/macOS parallelize with GNU parallel (installed above). Windows
          # git-bash can't: bats needs flock/shlock it lacks, and GNU parallel's
          # per-job overhead on git-bash's slow process spawning is pathological
          # (the suite hung for hours). Serial is both correct and faster there.
          if [[ "$RUNNER_OS" != "Windows" ]] && parallel --version >/dev/null 2>&1; then
            bats --jobs 4 tests/ --tap
          else
            bats tests/ --tap
          fi
        env:
          TERM: xterm
