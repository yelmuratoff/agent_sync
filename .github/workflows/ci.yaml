name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -S warning -e SC1091 bin/agentsync.sh
          shellcheck -x -S warning -e SC1091 lib/sync.sh
          shellcheck -x -S warning -e SC1091 lib/check.sh
          shellcheck -x -S warning -e SC1091 lib/setup_hooks.sh
          shellcheck -x -S warning -e SC1091 lib/helpers/*.sh

  # Linux/macOS parallelize the whole suite with GNU parallel — a few minutes.
  test-unix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core and GNU parallel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats parallel
          else
            brew install bats-core parallel
          fi
      - name: Run tests
        shell: bash
        env:
          TERM: xterm
        run: bats --jobs 4 tests/ --tap

  # git-bash can't run bats --jobs (no flock; GNU parallel hangs for hours) and
  # the full suite runs serially in ~58m. Shard the files across jobs instead:
  # each job runs its slice serially, cutting wall-clock to ~8m/shard. More
  # shards hit a floor (~5-6m) as per-job overhead dominates, so 8 is the knee.
  test-windows:
    name: Test (windows, shard ${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        shell: bash
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Exclude work dirs from Defender
        shell: pwsh
        continue-on-error: true
        run: |
          # Defender real-time scanning of every spawned process dominates the
          # process-heavy bats run on Windows; excluding the trees is a cheap win.
          Add-MpPreference -ExclusionPath "${env:GITHUB_WORKSPACE}"
          Add-MpPreference -ExclusionPath "${env:RUNNER_TEMP}"
          Add-MpPreference -ExclusionPath "${env:TEMP}"
      - name: Run shard serially
        shell: bash
        env:
          TERM: xterm
          SHARD: ${{ matrix.shard }}
          TOTAL: "8"
        run: |
          # Greedy bin-pack the .bats files by test count into TOTAL shards. The
          # split is deterministic, so every shard computes the same assignment
          # and runs only its own slice — no shared state between jobs.
          sorted=$(for f in tests/*.bats; do printf '%s %s\n' "$(grep -c '^@test' "$f")" "$f"; done | sort -k1,1nr -k2,2)
          declare -a load
          for ((s=0; s<TOTAL; s++)); do load[s]=0; done
          mine=()
          while read -r cnt file; do
            [[ -n "$file" ]] || continue
            min=0
            for ((s=1; s<TOTAL; s++)); do (( load[s] < load[min] )) && min=$s; done
            load[min]=$(( load[min] + cnt ))
            (( min == SHARD - 1 )) && mine+=("$file")
          done <<< "$sorted"
          printf 'shard %s/%s: %d files\n' "$SHARD" "$TOTAL" "${#mine[@]}"
          printf '  %s\n' "${mine[@]}"
          bats "${mine[@]}" --tap
