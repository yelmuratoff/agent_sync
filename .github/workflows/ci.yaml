name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x bin/agentsync.sh
          shellcheck -x lib/sync.sh
          shellcheck -x lib/check.sh
          shellcheck -x lib/setup_hooks.sh
          shellcheck -x lib/helpers/*.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats
          else
            brew install bats-core
          fi

      - name: Run unit tests
        run: bats tests/cli.bats tests/files.bats tests/gitignore.bats tests/list.bats tests/generate.bats tests/init.bats tests/hooks.bats tests/release.bats --tap
        env:
          TERM: xterm

      - name: Run integration tests
        run: bats tests/sync.bats tests/sync_options.bats tests/check.bats --tap
        env:
          TERM: xterm
