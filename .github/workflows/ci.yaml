name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x -S warning -e SC1091 bin/agentsync.sh
          shellcheck -x -S warning -e SC1091 lib/sync.sh
          shellcheck -x -S warning -e SC1091 lib/check.sh
          shellcheck -x -S warning -e SC1091 lib/setup_hooks.sh
          shellcheck -x -S warning -e SC1091 lib/helpers/*.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and GNU parallel
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats parallel
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core parallel
          else
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Run tests
        shell: bash
        run: |
          # bats --jobs needs GNU parallel (Linux/macOS). Windows git-bash
          # lacks it, so fall back to serial there.
          if command -v parallel >/dev/null 2>&1; then
            bats --jobs 4 tests/ --tap
          else
            bats tests/ --tap
          fi
        env:
          TERM: xterm
