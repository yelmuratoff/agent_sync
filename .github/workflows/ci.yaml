name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck -x bin/agentsync.sh
          shellcheck -x lib/system/sync.sh
          shellcheck -x lib/system/check.sh
          shellcheck -x lib/system/setup_hooks.sh
          shellcheck -x lib/system/lib/*.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y bats
          else
            brew install bats-core
          fi

      - name: Run tests
        run: bats tests/ --tap
        env:
          TERM: xterm

      - name: Verify install script
        run: |
          bash install.sh
          agentsync version

      - name: Smoke test (init + sync + check)
        run: |
          mkdir /tmp/smoke-project && cd /tmp/smoke-project
          git init
          git config user.email "ci@test.com"
          git config user.name "CI"
          agentsync init
          agentsync sync
          agentsync check
          agentsync list
