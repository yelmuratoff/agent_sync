# OpenAI Codex Configuration
# Codex reads AGENTS.md from project root (not from .codex/)
# Codex rules (.codex/rules/*.rules) use Starlark format for command permissions — not managed by agentsync
# Codex subagents use TOML format — auto-converted from MD during sync
name: "OpenAI Codex"
enabled: true

targets:
  agents:
    dest: "AGENTS.md"

  skills:
    dest: ".agents/skills"

  subagents:
    dest: ".codex/agents"
    format: toml
