name: "OpenAI Codex"
enabled: true

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".agents/skills"

  subagents:
    dest: ".codex/agents"
    format: toml

  hooks:
    source: ".ai/src/hooks/codex.json"
    dest: ".codex/hooks.json"

  settings:
    source: ".ai/src/settings/codex.toml"
    dest: ".codex/config.toml"
