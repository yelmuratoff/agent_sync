# Gemini CLI Configuration
# Rules are inlined into GEMINI.md (Gemini uses hierarchical GEMINI.md files)
# Commands are auto-converted from MD to TOML format during sync
name: "Gemini CLI"
enabled: false

targets:
  agents:
    dest: ".gemini/GEMINI.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".gemini/skills"

  commands:
    dest: ".gemini/commands"
    format: toml

  subagents:
    dest: ".gemini/agents"

  # Gemini CLI stores both general settings and MCP servers in settings.json.
  # Put `mcpServers` inside this file (not a separate .mcp.json).
  settings:
    source: ".ai/src/settings/gemini.json"
    dest: ".gemini/settings.json"
