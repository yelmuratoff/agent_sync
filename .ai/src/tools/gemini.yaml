# Gemini CLI Configuration
# Commands are auto-converted from MD to TOML format during sync
name: "Gemini CLI"
enabled: true

targets:
  agents:
    dest: ".gemini/GEMINI.md"

  skills:
    dest: ".gemini/skills"

  commands:
    dest: ".gemini/commands"
    format: toml

  subagents:
    dest: ".gemini/agents"
