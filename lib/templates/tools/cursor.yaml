# Cursor Configuration
name: "Cursor"
enabled: false

targets:
  agents:
    dest: ".cursor/AGENTS.md"

  rules:
    dest: ".cursor/rules"
    # Rename .md to .mdc for Cursor
    extension: ".mdc"
    # Add Cursor-specific glob header
    header: "---\nglobs: '**/*'\nalwaysApply: true\n---"

  skills:
    dest: ".cursor/skills"

  subagents:
    dest: ".cursor/agents"

  mcp:
    source: ".ai/src/mcp/cursor.json"
    dest: ".cursor/mcp.json"

  hooks:
    source: ".ai/src/hooks/cursor.json"
    dest: ".cursor/hooks.json"
