# Claude Code Configuration
name: "Claude Code"
enabled: false

targets:
  agents:
    dest: ".claude/CLAUDE.md"

  rules:
    dest: ".claude/rules"
    # Append @rules/* imports to CLAUDE.md (Claude-specific behavior)
    append_imports: true

  skills:
    dest: ".claude/skills"

  commands:
    dest: ".claude/commands"

  subagents:
    dest: ".claude/agents"

  settings:
    source: ".ai/src/settings/claude.json"
    dest: ".claude/settings.json"

  mcp:
    source: ".ai/src/mcp/claude.json"
    dest: ".claude/.mcp.json"
