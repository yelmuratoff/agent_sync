name: "Amazon Q Developer"
enabled: false

targets:
  agents:
    dest: ".amazonq/rules/00-context.md"
  rules:
    dest: ".amazonq/rules"
  skills:
    inline_into_agents: true
  commands:
    inline_into_agents: true

  mcp:
    source: ".ai/src/mcp/amazonq.json"
    dest: ".amazonq/mcp.json"

  subagents:
    dest: ".amazonq/cli-agents"
    format: amazonq_json
