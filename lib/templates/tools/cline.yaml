name: "Cline"
enabled: false

# Cline reads the workspace AGENTS.md, and .cline/ supersedes the deprecated
# .clinerules/ it still reads: https://docs.cline.bot/customization/cline-rules
targets:
  agents:
    dest: "AGENTS.md"
    legacy_dest: ".clinerules/00-context.md"
  rules:
    dest: ".cline/rules"
    legacy_dest: ".clinerules"
  skills:
    dest: ".cline/skills"
  commands:
    dest: ".cline/workflows"
    legacy_dest: ".clinerules/workflows"
