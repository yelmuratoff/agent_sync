name: "Windsurf"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    dest: ".windsurf/rules"
    header: "---\ntrigger: always_on\n---"

  skills:
    dest: ".windsurf/skills"

  mcp:
    source: ".ai/src/mcp/windsurf.json"
    dest: ".windsurf/mcp_config.json"

  hooks:
    source: ".ai/src/hooks/windsurf.json"
    dest: ".windsurf/hooks.json"
