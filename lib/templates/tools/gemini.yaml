name: "Gemini CLI"
enabled: false

targets:
  agents:
    dest: ".gemini/GEMINI.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".gemini/skills"

  commands:
    dest: ".gemini/commands"
    format: toml

  subagents:
    dest: ".gemini/agents"

  settings:
    source: ".ai/src/settings/gemini.json"
    dest: ".gemini/settings.json"
