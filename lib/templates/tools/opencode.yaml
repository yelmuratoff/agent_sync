name: "OpenCode"
enabled: false

targets:
  agents:
    dest: "AGENTS.md"

  rules:
    inline_into_agents: true

  skills:
    dest: ".opencode/skills"

  commands:
    dest: ".opencode/commands"

  subagents:
    dest: ".opencode/agents"
    format: opencode_md

  settings:
    source: ".ai/src/settings/opencode.json"
    dest: "opencode.json"
