# Template for AI Tool Configuration
# Copy this file inside `.ai/src/tools/` as "<tool>.yaml" to add a new tool.

# Name of the tool (displayed in logs)
name: "Tool Name"

# Enable or disable synchronization for this tool
enabled: false

# Optional: profile variant. A thin variant tool (e.g. claude-hub.yaml) declares
# `base:` to inherit every field it does not set from the base tool, so it only
# needs to override the config-home dests below. `profile_home` records the
# config-home directory the variant writes into. Both are managed by
# `agentsync profile add` — you rarely write them by hand.
# base: claude
# profile_home: ".claude-hub"

# Define where files should be copied
targets:
  # The "Identity" file (AGENTS.md)
  agents:
    # Destination path relative to repo root
    dest: ".tool/AGENTS.md"

    # Optional: Override source file (default is .ai/src/AGENTS.md)
    # source: ".ai/src/AGENTS.tiny.md"

  # The "Rules" directory
  rules:
    # Destination directory for rule files
    dest: ".tool/rules"

    # Optional: Change file extension (default: keep original .md)
    # extension: ".mdc"

    # Optional: Add a header to the top of every rule file
    # header: 'globs: "**/*"'

    # Optional: Filter rules (bash globs). Each accepts a scalar ("a b c"),
    # an inline list ([a, b]), or a block list (one `- glob` per line).
    # include: "flutter-*.md"
    # exclude: "secret-*.md"

    # Optional: Override source directory (default is .ai/src/rules)
    # source: ".ai/src/my-rules"

    # Optional: Append imports to the main AGENTS file (Claude-specific)
    # append_imports: false

    # Optional: Merge all rules into a single file instead of a directory
    # merge_to_file: false

    # Optional: Append lightweight rule references (name + title) into agents file
    # instead of syncing rules as separate files (for tools without separate rules dir)
    # inline_into_agents: false

    # Optional: Prepend AGENTS.md content before merged rules (used with merge_to_file)
    # prepend_agents: false

  # The "Skills" directory
  skills:
    # Destination directory for skill folders
    dest: ".tool/skills"

    # Optional: Filter skills (folders)
    # include: "flutter*"
    # exclude: "python*"

    # Optional: Override source directory
    # source: ".ai/src/my-skills"

    # Optional: Append lightweight skill index (name + description) into agents file
    # instead of syncing skills as directories (for tools without native skills support)
    # inline_into_agents: false

  # Custom slash commands (optional)
  # commands:
  #   dest: ".tool/commands"
  #   # extension: ".cmd.md"      # Optional: change file extension
  #   # include: "*.md"           # Optional: filter (space-separated globs)
  #   # exclude: "draft-*.md"     # Optional: filter (space-separated globs)
  #
  #   # For tools without a native commands surface (e.g. Codex):
  #   # emit each .ai/src/commands/<name>.md as a generated skill at
  #   # <targets.skills.dest>/command-<name>/SKILL.md. Requires targets.skills.dest.
  #   # Mutually exclusive with `dest` and `inline_into_agents`.
  #   # as_skills: true
  #
  #   # For tools that also lack a skills dir (e.g. Amazon Q, Zed):
  #   # append a "## Commands" index to the AGENTS-like file with
  #   # one "- `/<name>` — <description>" line per command.
  #   # Requires targets.agents.dest (or rules.merge_to_file fallback).
  #   # Mutually exclusive with `dest` and `as_skills`.
  #   # inline_into_agents: true

  # Subagent personas (optional)
  # subagents:
  #   dest: ".tool/agents"
  #   # extension: ".agent.md"    # Optional: change file extension

  # Settings/permissions (optional, file copy)
  # settings:
  #   source: ".ai/src/settings/tool.json"
  #   dest: ".tool/settings.json"

  # MCP server configs (optional, file copy)
  # mcp:
  #   source: ".ai/src/mcp/tool.json"
  #   dest: ".tool/.mcp.json"

  # Hooks (optional, file copy)
  # hooks:
  #   source: ".ai/src/hooks/tool.json"
  #   dest: ".tool/hooks.json"

# Optional: Command to run after sync (e.g. linter or formatter)
# post_sync: "npx prettier --write .tool/rules/*.mdc"
